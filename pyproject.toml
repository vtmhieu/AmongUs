[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amongus-governance"
version = "0.1.0"
description = "Do voting rules reduce the damage from malicious AI agents? A governance experiment in the Among Us sandbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
authors = [
    { name = "Rong Jin", email = "rongjin@kth.se" },
    { name = "Hieu Vu", email = "hieuvtm@kth.se" },
]
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
govlab = "govlab.cli:main"

[tool.setuptools.packages.find]
include = ["amongagents*", "govlab*"]

[tool.setuptools.package-data]
govlab = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]
